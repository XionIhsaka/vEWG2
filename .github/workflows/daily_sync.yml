name: Pilot Roster Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours.
  workflow_dispatch:   # Allows you to run it manually from the 'Actions' tab.

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    
    steps:


      # 1. Setup Environment
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      # 2. Run the Python Script
      - name: Run Sync Script
        env:
          VAMSYS_CLIENT_ID: ${{ secrets.VAMSYS_CLIENT_ID }}
          VAMSYS_CLIENT_SECRET: ${{ secrets.VAMSYS_CLIENT_SECRET }}
        run: python pilot_sync.py

      # 3. Commit the new JSON file
      - name: Commit and Push to GitHub
        run: |
          # REPLACE THESE with your actual GitHub email and username
          git config --local user.email "233835952+XionIhsaka@users.noreply.github.com"
          git config --local user.name "Chris Eibl"
          
          git add pilot_activity.json
          
          # [skip ci] prevents an infinite loop of actions
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update pilot roster [skip ci]"
            git push origin main
          fi
